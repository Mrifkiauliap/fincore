version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-fincore_pass}
      POSTGRES_DB: fincore_db
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincore_net

  # ─── Valkey ───────────────────────────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8.1.7-alpine
    container_name: fincore-valkey
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincore_net

  # ─── Bull Board (Queue Monitoring) ───────────────────────────────────────────
  bull-board:
    image: deadly0/bull-board
    container_name: fincore-bull-board
    restart: unless-stopped
    # ports:
    #   - "3010:3000"
    networks:
      - fincore_net
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_USE_TLS: "false"
      BULL_VERSION: BULLMQ
      QUEUE_NAMES: incoming-message;voice-transcription;image-ocr;ai-extraction;categorization;report-generation;wa-sender;confirmation;recurring-setup;recurring-reminder;event-publishing;monthly-report;budget-check;budget-command;transaction-command;custom-command;settings-command;budget-rollover
      # Optional: auth
      BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-admin}
      # BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-admin}
    depends_on:
      - valkey

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fincore-cloudflared
    restart: unless-stopped
    command: tunnel run
    networks:
      - fincore_net
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # ─── API (uncomment for containerized dev) ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: fincore-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ─── Worker (uncomment for containerized dev) ─────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: fincore-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ─── Sender (uncomment for containerized dev) ─────────────────────────────────
  sender:
    build:
      context: .
      dockerfile: infrastructure/docker/sender.Dockerfile
    container_name: fincore-sender
    restart: unless-stopped
    env_file: .env
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:

networks:
  fincore_net:
    driver: bridge
