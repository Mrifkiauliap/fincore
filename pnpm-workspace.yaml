packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  esbuild: true
  msgpackr-extract: true
  sharp: true
minimumReleaseAgeExclude:
  - dayjs@1.11.21

supportedArchitectures:
  os:
    - current
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
